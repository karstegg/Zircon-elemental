name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Official target: Windows x64. macOS/Linux build from the same CMake
  # project; community ports welcome (see README "Platforms").
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZIRCON_BUILD_PLUGIN=ON

      - name: Build core + tests
        run: cmake --build build --config Release --target zircon zircon_tests --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Build plugin
        run: cmake --build build --config Release --target ZirconElemental_VST3 ZirconElemental_Standalone --parallel

      - name: Render demo patches
        shell: bash
        run: |
          BIN=$(find build -type f \( -name zircon -o -name zircon.exe \) | head -1)
          mkdir -p renders
          for p in patches/*.json; do "$BIN" render "$p" "renders/$(basename "$p" .json).wav"; done

      - name: Package
        shell: bash
        run: |
          ART=$(find build -type d -name ZirconElemental_artefacts | head -1)
          mkdir -p dist
          cp -R "$ART"/Release/VST3/*.vst3 dist/
          cp -R "$ART"/Release/Standalone/* dist/ 2>/dev/null || true
          cp README.md LICENSE dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ZirconElemental-windows-x64
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: demo-renders
          path: renders
